name: Verify Reimflow source (STRATO deployment managed by Publisher)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Python API syntax
        run: |
          python3 -m py_compile api.py rhyme_jobs.py platform_api.py rap-flow-analysis.py rhyme-quality.py rhyme-intent.py
          python3 -m unittest discover -s tests -p "test_platform_api.py"
          python3 -m unittest discover -s tests -p "test_rap_flow.py"
          python3 -m unittest discover -s tests -p "test_rhyme_api.py"
          python3 -m unittest discover -s tests -p "test_rhyme_async_http.py"
          python3 -m unittest discover -s tests -p "test_rhyme_timeout_fallback.py"
          python3 -m unittest discover -s tests -p "test_rhyme_quality.py"
          python3 -m unittest discover -s tests -p "test_german_only.py"
          python3 -m unittest discover -s tests -p "test_rhyme_intent.py"
      - name: Verify JavaScript syntax
        run: |
          node --check app.js
          node --check platform.js
          node --check mobile-build.mjs
          node mobile-build.mjs
          test -s www/index.html
          test -s www/platform.js
          test -s www/platform.css
          test -s www/ux-simple.css
          node --check rhyme-fallback.js
          node --check rhyme-previews.js
          node tests/rhyme-fallback.test.mjs
          node --check theme-engine.js
          node --check sonic-atelier.js
          node --check tests/comic-variants.test.mjs
          node tests/comic-variants.test.mjs
          node --check flow-scoring.js
          node --check flow-challenge.js
          node --check tests/flow-challenge.test.mjs
          node tests/flow-challenge.test.mjs
          node --check rap-audio.js
          node --check rap-flow.js
      - name: Install browser smoke dependencies
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Test actual desktop and mobile navigation in Chromium
        run: |
          node tests/navigation-browser.test.mjs
          node tests/rhyme-browser.test.mjs
          node tests/rhyme-async-browser.test.mjs
          node tests/rap-browser.test.mjs
          node tests/rap-result-browser.test.mjs
      - name: Verify complete existing prototype bundle
        run: |
          set -euo pipefail
          for file in index.html app.js platform.js platform.css platform_api.py rhyme_jobs.py role_admin.py rhyme-fallback.js rhyme-previews.js api.py styles.css themes.css ux-simple.css ai-engine.css sonic-atelier.css comic-flow.css comic-variants.css theme-engine.js sonic-atelier.js flow-scoring.js flow-challenge.js flow-challenge.css rap-audio.js rap-flow.js rap-flow.css rap-flow-analysis.py rhyme-quality.py rhyme-intent.py; do
            test -s "$file"
          done
          grep -q 'Reimflow' index.html
          grep -q 'platform.js?v=20261015-real1' index.html
          grep -q 'platform.css?v=20261015-real1' index.html
          grep -q 'sonic-atelier.css?v=20261014-de1' index.html
          grep -q 'app.js?v=20261020-ux1' index.html
          grep -q 'ux-simple.css?v=20261020-3' index.html
          grep -q 'data-page="more"' index.html
          grep -q 'rhyme-fallback.js?v=20261019-de1' index.html
          grep -q 'rhyme-previews.js?v=20261019-de1' index.html
          grep -q 'ai-engine.css?v=20261015-phrase3' index.html
          grep -q 'comic-flow.css?v=20261014-de1' index.html
          grep -q 'REIMFLOW / COMIC FLOW' comic-flow.css
          grep -q 'comic-variants.css?v=20261014-de1' index.html
          grep -q 'FOUR COMIC EDITIONS' comic-variants.css
          grep -q 'data-theme-option="comic-graffiti"' index.html
          grep -q 'data-theme-option="comic-novel"' index.html
          grep -q 'data-theme-option="comic-clean"' index.html
          grep -q 'data-theme-pick="sonic-art"' index.html
          grep -q 'data-comic-style="graffiti"' comic-variants.css
          grep -q 'data-comic-style="novel"' comic-variants.css
          grep -q 'data-comic-style="clean"' comic-variants.css
          grep -q 'flow-challenge.js?v=20261014-de1' index.html
          grep -q 'flow-scoring.js?v=20261014-de1' index.html
          grep -q 'flow-challenge.css?v=20261014-flow1' index.html
          grep -q '/api/health' api.py
          grep -q '/api/rhymes' api.py
          grep -q '/api/validate' api.py
          grep -q '/api/flow/analyze' api.py
          grep -q 'rap-flow.js?v=20261015-wav1' index.html
          grep -q 'rap-flow.css?v=20261015-wav1' index.html
          grep -q 'data-page="flow"' index.html
          grep -q 'id="rapPanel"' index.html
          grep -q 'rap-audio.js?v=20261015-wav1' index.html
          grep -q 'id="rapRecordingDuration"' index.html
          echo "Source is valid. STRATO deployment lives in hsdarestani/publisher under .github/workflows/reimflow-strato-deploy.yml."
