name: Audit production corpus influence (read-only)
on:
  push:
    paths:
      - .github/workflows/corpus-impact-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Test real request handler with isolated corpus on/off/revoked
        run: |
          python3 -m unittest discover -s tests -p "test_corpus_influence.py" -v
      - name: Test public health, quality-reviewed search and metadata privacy
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error
          ROOT="https://reimflow.smarbiz.sbs"
          def request(method,path,payload=None):
              data=None if payload is None else json.dumps(payload,ensure_ascii=False).encode("utf8")
              req=urllib.request.Request(ROOT+path,data=data,method=method,
                  headers={"Accept":"application/json","Content-Type":"application/json",
                           "User-Agent":"ReimflowPublicPrivacyQA/1.0"})
              with urllib.request.urlopen(req,timeout=30) as response:
                  return response.status,json.load(response)
          _,health=request("GET","/api/health")
          assert health["ok"] and health["ai"]
          assert "model" not in health,health
          for path in ("/api/corpus/status","/api/rhymes/context-status"):
              try:
                  request("GET",path)
                  raise AssertionError("Public diagnostic exposed: "+path)
              except urllib.error.HTTPError as e:
                  assert e.code==404,(path,e.code)
          for query in ("Nacht","Abendhimmel","Neonlichter"):
              status,answer=request("POST","/api/rhymes",{"query":query,"category":"Alle","syllables":"Alle"})
              if status==202:
                  for i in range(105):
                      time.sleep(2)
                      status,answer=request("GET","/api/rhymes/jobs/"+answer["job_id"])
                      if status!=202:break
              assert status==200,(query,status,answer)
              assert answer["ok"] and answer["quality_reviewed"]
              for hidden in ("knowledge","context_revision","model","review_model","timing_ms","quality_method","intent"):
                  assert hidden not in answer,(query,hidden)
              assert all(item.get("german_valid") is True for item in answer.get("rhymes",[]))
              print("PUBLIC RHYME QA:",query,"suggestions:",len(answer.get("rhymes",[])))
          print("PUBLIC SEARCH + PRIVACY AUDIT PASSED")
          PY
